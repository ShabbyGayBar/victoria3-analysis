site_name: Victoria 3 Analysis
site_description: Parse Victoria 3 data, model its economy, and optimize production chains.
site_url: https://shabbygaybar.github.io/victoria3-analysis/
repo_url: https://github.com/ShabbyGayBar/victoria3-analysis
repo_name: ShabbyGayBar/victoria3-analysis
edit_uri: edit/DEV/docs/
site_dir: site
strict: true

watch:
  - mkdocs.yml
  - README.md
  - docs
  - examples
  - figures
  - tables
  - src/vic3_analysis

theme:
  name: material
  icon:
    logo: material/chart-line
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep-orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    absolute_links: warn
    anchors: warn
    not_found: warn
    unrecognized_links: warn

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            backlinks: tree
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            filters: ["!^_"]
            heading_level: 2
            inherited_members: false
            merge_init_into_class: true
            members_order: source
            parameter_headings: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

markdown_extensions:
  - attr_list
  - admonition
  - callouts:
      strip_period: false
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Guides:
      - guides/index.md
      - Parsing game data: guides/parsing.md
      - Economy and optimization: guides/economy.md
      - Supply-chain analysis: guides/supply-chain.md
  - Showcase:
      - showcase/index.md
      - Parsed data: showcase/parsed-data.md
      - Buy packages: showcase/buy-packages.md
      - Supply chains: showcase/supply-chains.md
      - Resource-limited optimization: showcase/resource-limited-optimization.md
  - API Reference:
      - api/index.md
      - Parsing and utilities: api/parsing.md
      - Economy and production: api/economy.md
      - Optimization: api/optimization.md
      - Supply chains: api/supply-chain.md
  - Project:
      - Roadmap: roadmap.md
      - Repository structure: project_structure.md
      - License: license.md
